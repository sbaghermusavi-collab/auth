
<!DOCTYPE html>
<html lang="fa" dir="rtl" data-auth-tone="dark" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آسانک — تغییر رمز عبور</title>
  <link rel="stylesheet" href="/auth/resources/css/stylesLogin.css" />
    <link rel="stylesheet" href="/auth/tenant-assets/theme.css" />
  </head>
<body>
<div class="auth-root">
  <div class="form-shell">
    <div class="brand-logo">
      <span class="mark">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-4 3v-3H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z" />
          <path d="M8 9.5h8M8 12.5h5" />
        </svg>
      </span>
      <span class="name">آسانک</span>
    </div>
    <div class="form-center">
      <div class="form-card">
        <h1 class="scr-title" id="page-title">رمز عبور شما منقضی شده است</h1>
        <p class="scr-sub" id="page-sub">لطفاً یک رمز عبور جدید تعیین کنید.</p>

        <form id="pw-form">
          <div class="fld" id="current-pw-group">
            <label class="field-label">رمز عبور فعلی</label>
            <div class="fld-wrap">
              <input class="fld-input" id="f-current" type="password" autocomplete="current-password" required>
            </div>
          </div>
          <div class="fld">
            <label class="field-label">رمز عبور جدید</label>
            <div class="fld-wrap">
              <input class="fld-input" id="f-new" type="password" autocomplete="new-password" minlength="8" required>
            </div>
          </div>
          <p class="fld-hint error" id="pw-error" style="display: none"></p>
          <button type="submit" class="btn btn-primary btn-block" id="primary" style="height: 48px; margin-top: 22px">
            تغییر رمز و ورود
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script th:inline="javascript">
const params = new URLSearchParams(location.search);
const identifier = params.get('identifier') || params.get('phone') || '';
const serverAppRoot = /*[[${appRootUrl != null ? appRootUrl : '/'}]]*/ '/';
const defaultAppRoot = (serverAppRoot.includes("localhost") && window.location.hostname !== "localhost" && window.location.hostname !== "127.0.0.1")
    ? (window.location.origin + "/")
    : serverAppRoot;
const continueUrl = params.get('continue') || defaultAppRoot;
const isReset = params.get('reset') === 'true' || params.get('mode') === 'reset';

function applyResetMode() {
    if (isReset) {
        const titleEl = document.getElementById('page-title');
        if (titleEl) titleEl.textContent = 'تعیین رمز عبور جدید';
        const subEl = document.getElementById('page-sub');
        if (subEl) subEl.textContent = 'لطفاً رمز عبور جدید خود را وارد کنید.';
        const currentGroup = document.getElementById('current-pw-group');
        if (currentGroup) currentGroup.style.display = 'none';
        const currentInput = document.getElementById('f-current');
        if (currentInput) {
            currentInput.removeAttribute('required');
            currentInput.value = '';
        }
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyResetMode);
} else {
    applyResetMode();
}

function safeContinueUrl(target) {
    if (!target || target === '/success' || target.includes('/api/auth/') || target.endsWith('/login') || target.includes('/login?')) return defaultAppRoot;
    try {
        const url = new URL(target, window.location.origin);
        if (url.pathname.includes('/api/auth/') || url.pathname.endsWith('/login')) {
            return defaultAppRoot;
        }
        if (url.protocol === 'http:' || url.protocol === 'https:') {
            if (url.hostname === 'localhost' && window.location.hostname !== 'localhost') {
                url.hostname = window.location.hostname;
                url.port = window.location.port;
            }
            return url.href;
        }
        return url.pathname + url.search + url.hash;
    } catch (err) {
        return defaultAppRoot;
    }
}

async function readError(response) {
    try {
        const data = await response.json();
        return data.message || data.error || response.statusText;
    } catch (err) {
        return response.statusText;
    }
}

document.getElementById('pw-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('pw-error');
    const submitBtn = document.getElementById('primary');
    errorEl.style.display = 'none';
    submitBtn.disabled = true;

    try {
        const endpoint = isReset ? '/api/auth/password/reset' : '/api/auth/password/change-expired';
        const payload = isReset ? {
            identifier,
            newPassword: document.getElementById('f-new').value
        } : {
            identifier,
            currentPassword: document.getElementById('f-current').value,
            newPassword: document.getElementById('f-new').value
        };

        const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!res.ok) {
            throw new Error(await readError(res));
        }

        const data = await res.json();
        window.location.href = safeContinueUrl(data.redirectUrl || continueUrl);
    } catch (err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
    }
});
</script>
</body>
</html>
