spring:
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: jdbc:mysql://192.168.100.123:3309/auth
    username: root
    password: rootpassword
    driverClassName: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  liquibase:
    database-change-log-table: Z_LIQ_CHANGELOG
    database-change-log-lock-table: Z_LIQ_CHANGELOG_LOCK
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  h2:
    console:
      enabled: false
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

logging:
  level:
    root: INFO
    com.bontech.auth: DEBUG
    org.springframework.security: DEBUG
    com.zaxxer.hikari: WARN
    liquibase: INFO
app:
  jwt:
    secret: "01234567890123456789012345678901"
    expiration-seconds: 3600
  captcha:
    url: "http://milky.peykasa.ir/api/user-service/captcha/generate"
    validate-url: "http://milky.peykasa.ir/api/user-service/captcha/validate"
  sms:
    sender-api-url: "https://sms.example/send"
    sender-api-key: "replace-with-real-key"
  auth:
    otp-enabled: true
    password-enabled: true
    captcha-enabled: false
    test-mode: true
    otp-expiration-seconds: 180
    login-inactivity-timeout-seconds: 180

server:
  max-http-request-header-size: 40KB
  servlet:
    context-path: /auth
  forward-headers-strategy: framework
  port: 8083
